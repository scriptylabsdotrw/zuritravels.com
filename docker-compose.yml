services:
  postgres:
    image: postgres:17-alpine
    container_name: soulexp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: soulexp
      POSTGRES_PASSWORD: soulexp_dev_pwd
      POSTGRES_DB: soulexp
    ports:
      - "5433:5432"
    volumes:
      - soulexp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulexp -d soulexp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  soulexp_pg_data:
